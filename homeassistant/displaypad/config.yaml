name: DisplayPad
version: "0.1.2"
slug: displaypad
description: >-
  Shows streaming-app keys (Netflix, Hulu, Disney+, Prime Video, YouTube, Tubi,
  Pluto TV, Max) on a Mountain DisplayPad and launches them on the Apple TV.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Key presses and the image handshake use the vendor HID interface (hidraw);
# hidraw numbers shift on replug, so a range is listed (the Supervisor skips
# missing paths and grants them on hotplug). The pixel data goes to USB
# interface 1, which has no kernel driver (OUT endpoint only), so it is
# written through libusb and needs /dev/bus/usb.
usb: true
devices:
  - /dev/hidraw0
  - /dev/hidraw1
  - /dev/hidraw2
  - /dev/hidraw3
  - /dev/hidraw4
  - /dev/hidraw5
  - /dev/hidraw6
  - /dev/hidraw7
  - /dev/hidraw8
  - /dev/hidraw9
# Lets actions call the Core REST API via http://supervisor/core/api with
# $SUPERVISOR_TOKEN.
homeassistant_api: true
# Lets the daemon restart its own container (POST /addons/self/restart) when
# a replugged pad is unreachable over libusb, so it gets fresh USB nodes.
hassio_api: true
map:
  - addon_config:rw
