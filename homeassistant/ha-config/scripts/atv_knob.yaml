atv_knob:
  alias: Apple TV knob
  description: >-
    ActionRing large knob. Skips back/forward while something is playing or
    paused; otherwise moves focus left/right (Home screen, app menus).
  mode: queued
  max: 20
  fields:
    direction:
      description: left or right
      example: right
  sequence:
    - action: remote.send_command
      target:
        entity_id: remote.vugitv_4k_vugitv_4k
      data:
        command: >-
          {{ ('skip_forward' if direction == 'right' else 'skip_backward')
             if is_state('media_player.vugitv_4k_vugitv_4k', ['playing', 'paused'])
             else ('right' if direction == 'right' else 'left') }}
